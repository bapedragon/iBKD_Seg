[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkd-seg"
version = "0.1.0"
description = "Phase-gated evaluation of iBKD representations for segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "timm==1.0.27",
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "scipy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
